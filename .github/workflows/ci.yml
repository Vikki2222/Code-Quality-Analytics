name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20 # matches the node:20-alpine production images
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Unit tests mock Postgres, Redis, GitHub and the AI providers - no secrets needed.
      - run: npm test

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Production file only (the override is local-only). Unset ${VARS}
      # resolve to empty with a warning; this checks structure, not values.
      - run: docker compose -f docker-compose.yml config --quiet
