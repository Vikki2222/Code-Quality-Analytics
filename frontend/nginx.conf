# Keep the original scheme when another proxy (e.g. Coolify/Traefik
# terminating TLS) is in front; fall back to our own scheme otherwise.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Proxy API calls to the Express backend
    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Express (trust proxy) reads these for req.ip (rate limiting)
        # and req.secure (Secure session cookie).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Cookie $http_cookie;
    }

    location / {
        try_files $uri $uri/ /index.html;
        # index.html must revalidate on every load, otherwise browsers keep
        # an old copy pointing at asset hashes that no longer exist after a
        # deploy. (Hashed /assets/ files below are cached forever instead.)
        add_header Cache-Control "no-cache";
        # Helmet sets these on API responses; the SPA shell needs them too.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}